<div class="container-standard">
  <app-page-header
    icon="📋"
    title="Templates Packlist"
    subtitle="Gerencie templates para uso nos clientes">
    <button class="btn btn-primary" (click)="newTemplate()">+ Novo Template</button>
  </app-page-header>

  <ng-container *ngIf="!isCreating && !selectedTemplate">
    <div class="content-section">
      <div class="toolbar">
        <input 
          type="text" 
          placeholder="🔎 Buscar templates..." 
          [(ngModel)]="searchTerm"
          class="search">
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Nome do Template</th>
            <th>Descrição</th>
            <th>Arquivo</th>
            <th>Data Criação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="filteredTemplates.length === 0">
            <td colspan="5" class="empty-state">Nenhum template encontrado</td>
          </tr>
          <tr *ngFor="let template of filteredTemplates">
            <td class="template-name">{{ template.nome }}</td>
            <td class="template-descricao" [title]="template.descricao || ''">{{ template.descricao || '—' }}</td>
            <td class="template-arquivo">{{ template.nomeArquivo }}</td>
            <td class="template-data">{{ template.dataCriacao | date:'dd/MM/yyyy' }}</td>
            <td>
              <div class="row-actions">
                <button class="btn-icon" title="Editar template" (click)="selectTemplate(template)">✏️</button>
                <button class="btn-icon danger" title="Excluir template" (click)="deleteTemplate(template.id)">🗑️</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <ng-container *ngIf="isCreating || selectedTemplate">
    <app-templates-packlist-detail 
      [template]="selectedTemplate"
      (saved)="onSaveTemplate()"
      (cancelled)="onCancelTemplate()">
    </app-templates-packlist-detail>
  </ng-container>
</div>

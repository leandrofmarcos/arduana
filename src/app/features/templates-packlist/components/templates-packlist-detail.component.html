<div class="detail-container">
  <div class="detail-header">
    <h3>{{ isEditMode ? 'Editar Template' : 'Novo Template' }}</h3>
    <button class="btn-close" (click)="cancel()">×</button>
  </div>

  <div class="form-section">
    <div class="form-group">
      <label>Nome do Template *</label>
      <input 
        type="text" 
        [(ngModel)]="form.nome"
        placeholder="Ex: Template Exportação USA"
        class="form-control">
    </div>

    <div class="form-group">
      <label>Descrição</label>
      <textarea 
        [(ngModel)]="form.descricao"
        placeholder="Descrição do template (opcional)"
        class="form-control"
        rows="3"></textarea>
    </div>

    <div class="upload-section">
      <h4>Arquivo e Mapeamento</h4>
      
      <ng-container *ngIf="!hasConfig">
        <button class="btn-upload" (click)="openUploadModal()">
          📤 Carregar Arquivo e Mapear
        </button>
      </ng-container>

      <ng-container *ngIf="hasConfig">
        <div class="config-summary">
          <div class="summary-item">
            <span class="label">Arquivo:</span>
            <span class="value">{{ template?.nomeArquivo }}</span>
          </div>
          <div class="summary-item">
            <span class="label">Linha de Início:</span>
            <span class="value">{{ template?.config?.linhaInicio }}</span>
          </div>
          <div class="mapping-grid">
            <div class="mapping-row" *ngFor="let item of (columnLabels | keyvalue)">
              <span class="mapping-label">{{ item.key }}:</span>
              <span class="mapping-value">{{ item.value }}</span>
            </div>
          </div>
          <button class="btn-edit-upload" (click)="openUploadModal()">
            ✎ Editar Mapeamento
          </button>
        </div>
      </ng-container>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn-cancel" (click)="cancel()">Cancelar</button>
    <button class="btn-save" (click)="save()" [disabled]="!hasConfig">Salvar Template</button>
  </div>

  <ng-container *ngIf="showUploadModal">
    <app-templates-packlist-upload-modal
      [templateToEdit]="template"
      (complete)="onUploadComplete($event)"
      (close)="onUploadModalClose()">
    </app-templates-packlist-upload-modal>
  </ng-container>
</div>

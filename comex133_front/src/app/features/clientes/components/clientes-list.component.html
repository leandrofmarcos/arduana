<div class="container-standard">
  <app-page-header
    icon="👥"
    title="Cadastro de Clientes"
    subtitle="Gerencie clientes para uso nos processos">
    <button class="btn btn-primary" (click)="createNew()">+ Novo Cliente</button>
  </app-page-header>

  <ng-container *ngIf="!isCreating && !selectedCliente">
    <div class="content-section">
      <div class="toolbar">
        <input 
          class="search" 
          type="text" 
          [(ngModel)]="searchTerm" 
          placeholder="🔎 Buscar por nome" 
        />
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Contato</th>
            <th>Template Packlist</th>
            <th style="width: 120px;">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="filteredClientes.length === 0">
            <td colspan="4" class="empty-state">Nenhum cliente encontrado</td>
          </tr>
          <tr *ngFor="let cliente of filteredClientes">
            <td class="cliente-name">{{ cliente.nome }}</td>
            <td>{{ cliente.contato || '—' }}</td>
            <td>
              <span *ngIf="cliente.templatePacklistId" class="badge-template" [title]="getTemplateName(cliente.templatePacklistId)">
                📋 {{ getTemplateName(cliente.templatePacklistId) }}
              </span>
              <span *ngIf="!cliente.templatePacklistId" class="no-template">—</span>
            </td>
            <td>
              <div class="row-actions">
                <button class="btn-icon" title="Editar cliente" (click)="selectCliente(cliente)">✏️</button>
                <button class="btn-icon danger" title="Excluir cliente" (click)="deleteCliente(cliente.id)">🗑️</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <app-cliente-detail
    *ngIf="isCreating || selectedCliente"
    [cliente]="selectedCliente"
    (saved)="onSaved()"
    (cancelled)="onCancelled()"
  ></app-cliente-detail>
</div>

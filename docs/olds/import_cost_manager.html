<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamentos de Importação</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); min-height: 100vh; padding: 30px 60px; }
        .container { max-width: 1920px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 25px 80px rgba(0,0,0,0.45); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 40px 50px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 30px; font-weight: 800; }
        .header .meta { display: flex; gap: 12px; align-items: center; }
        .badge { display: inline-block; padding: 6px 12px; background: #48bb78; color: white; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .main { display: grid; grid-template-columns: 1fr 420px; min-height: calc(100vh - 180px); }
        .left { padding: 40px 50px; background: #f8fafc; border-right: 1px solid #e2e8f0; }
        .right { padding: 40px 35px; background: white; position: sticky; top: 0; height: fit-content; }
        .section-title { font-size: 20px; color: #1e3c72; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 3px solid #667eea; display: flex; align-items: center; gap: 12px; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 25px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 13px; font-weight: 700; color: #4a5568; }
        .field input, .field select, .field textarea { padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; background: white; transition: all .2s; }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.12); }
        .actions { display: flex; gap: 12px; }
        .btn { padding: 12px 16px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .25s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(102,126,234,0.4); }
        .btn-secondary { background: white; color: #667eea; border: 2px solid #667eea; }
        .btn-secondary:hover { background: #667eea; color: white; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; }
        .chip { padding: 8px 14px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 13px; font-weight: 700; color: #2d3748; cursor: pointer; }
        .chip.active { border-color: #667eea; background: #ebf4ff; color: #1e3c72; }
        .category-group { background: white; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
        .category-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: #f7fafc; font-weight: 800; color: #2d3748; }
        .category-total { font-weight: 800; color: #1e3c72; }
        .expense-list { display: grid; grid-template-columns: 1.5fr 1fr 0.6fr 0.6fr; gap: 12px; padding: 12px 18px; align-items: center; border-top: 1px solid #edf2f7; }
        .expense-list:nth-child(even) { background: #fcfdff; }
        .expense-amount { text-align: right; font-weight: 800; }
        .expense-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .summary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 28px; border-radius: 12px; margin-bottom: 22px; }
        .summary h3 { font-size: 18px; margin-bottom: 18px; font-weight: 800; opacity: .95; }
        .summary-item { background: rgba(255,255,255,0.18); padding: 14px 16px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.3); }
        .summary-item label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; opacity: .92; font-weight: 700; }
        .summary-item .value { font-size: 22px; font-weight: 800; }
        .summary-item.highlight { background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); }
        .toolbar { display: flex; gap: 12px; margin-top: 18px; }
        @media (max-width: 1600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 1400px) { .main { grid-template-columns: 1fr 380px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gestão de Orçamentos de Importação</h1>
            <div class="meta">
                <span class="badge">✓ Ativo</span>
                <span id="last-update"></span>
            </div>
        </div>
        <div class="main">
            <div class="left">
                <h2 class="section-title">Despesas por Categoria</h2>
                <div class="grid grid-2" style="margin-bottom:16px;">
                    <div class="field">
                        <label>Categoria</label>
                        <select id="expense-category">
                            <option>Agência Marítima</option>
                            <option>Despachante</option>
                            <option>Tributos</option>
                            <option>Porto</option>
                            <option>Outros</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Item</label>
                        <input id="expense-item" type="text" placeholder="Descrição do item">
                    </div>
                    <div class="field">
                        <label>Fornecedor</label>
                        <input id="expense-vendor" type="text" placeholder="Fornecedor opcional">
                    </div>
                    <div class="field">
                        <label>Valor (R$)</label>
                        <input id="expense-amount" type="number" step="0.01" placeholder="0,00">
                    </div>
                    <div class="field" style="grid-column: 1 / -1;">
                        <label>Observação</label>
                        <textarea id="expense-note" rows="2" placeholder="Detalhes opcionais"></textarea>
                    </div>
                </div>
                <div class="actions" style="margin-bottom:16px;">
                    <button class="btn btn-primary" onclick="addExpense()">Adicionar</button>
                    <button class="btn btn-secondary" onclick="clearForm()">Limpar campos</button>
                </div>
                <div class="chip-group" id="chip-group"></div>
                <div id="categories-container"></div>
            </div>
            <div class="right">
                <div class="summary">
                    <h3>Resumo das Despesas</h3>
                    <div class="summary-item"><label>Agência Marítima</label><div class="value" id="sum-agencia">R$ 0,00</div></div>
                    <div class="summary-item"><label>Despachante</label><div class="value" id="sum-despachante">R$ 0,00</div></div>
                    <div class="summary-item"><label>Tributos</label><div class="value" id="sum-tributos">R$ 0,00</div></div>
                    <div class="summary-item"><label>Porto</label><div class="value" id="sum-porto">R$ 0,00</div></div>
                    <div class="summary-item"><label>Outros</label><div class="value" id="sum-outros">R$ 0,00</div></div>
                    <div class="summary-item highlight"><label>Total de Despesas</label><div class="value" id="sum-total">R$ 0,00</div></div>
                    <div class="toolbar">
                        <button class="btn btn-secondary" onclick="exportar()">Exportar</button>
                        <button class="btn btn-primary" onclick="salvar()">Salvar</button>
                    </div>
                </div>
                <div class="summary" style="background: white; color:#2d3748; border: 2px solid #e2e8f0;">
                    <h3>Operações</h3>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="limpar()">Nova Simulação</button>
                        <button class="btn btn-secondary" onclick="duplicar()">Duplicar</button>
                        <button class="btn btn-primary" onclick="finalizar()">Finalizar Importação</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const categories = ["Agência Marítima","Despachante","Tributos","Porto","Outros"];
        let expenses = [];
        let activeFilter = "Todas";
        function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}        
        function nowStr(){const d=new Date();return d.toLocaleDateString('pt-BR')+" "+d.toLocaleTimeString('pt-BR');}
        function seed(){
            return [
                {id:1,cat:"Porto",item:"THC - V3",vendor:"",amount:1280.00,note:""},
                {id:2,cat:"Agência Marítima",item:"Liberação de B/L - V3",vendor:"",amount:900.00,note:""},
                {id:3,cat:"Agência Marítima",item:"Frete Marítimo - V3",vendor:"",amount:1450.00,note:""},
                {id:4,cat:"Agência Marítima",item:"ISPS - V3",vendor:"",amount:100.00,note:""},
                {id:5,cat:"Agência Marítima",item:"Desconsolidação - V3",vendor:"",amount:1436.52,note:""},
                {id:6,cat:"Agência Marítima",item:"Lift Off - V3",vendor:"",amount:330.00,note:""},
                {id:7,cat:"Tributos",item:"AFRMM + Taxa Sistema",vendor:"",amount:3000.00,note:""},
                {id:8,cat:"Porto",item:"Armazenagem",vendor:"",amount:17000.00,note:""},
                {id:9,cat:"Agência Marítima",item:"LOG FEE / TRS / IMP. LOG FEE",vendor:"",amount:600.00,note:""},
                {id:10,cat:"Porto",item:"Taxa de Expediente",vendor:"",amount:500.00,note:""},
                {id:11,cat:"Outros",item:"S.D.A.",vendor:"",amount:3932.00,note:""},
                {id:12,cat:"Outros",item:"Siscoserv",vendor:"",amount:244.00,note:""},
                {id:13,cat:"Porto",item:"TUS - Utilização Siscomex",vendor:"",amount:350.00,note:""},
                {id:14,cat:"Despachante",item:"Honorários Despachante",vendor:"",amount:5200.00,note:""},
                {id:15,cat:"Outros",item:"Honorários Trading",vendor:"",amount:3500.00,note:""},
                {id:16,cat:"Despachante",item:"Taxa Emissão L.I.",vendor:"",amount:0.00,note:""},
                {id:17,cat:"Outros",item:"Outras Despesas",vendor:"",amount:0.00,note:""},
                {id:18,cat:"Outros",item:"Frete Rodoviário Interno",vendor:"",amount:5800.00,note:""}
            ];
        }
        function load(){
            const raw = localStorage.getItem('import_cost_expenses');
            expenses = raw ? JSON.parse(raw) : seed();
            renderChips();
            renderAll();
            document.getElementById('last-update').textContent = nowStr();
        }
        function persist(){ localStorage.setItem('import_cost_expenses', JSON.stringify(expenses)); }
        function addExpense(){
            const cat = document.getElementById('expense-category').value;
            const item = document.getElementById('expense-item').value.trim();
            const vendor = document.getElementById('expense-vendor').value.trim();
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const note = document.getElementById('expense-note').value.trim();
            if(!item || isNaN(amount)) { alert('Preencha item e valor.'); return; }
            expenses.push({ id: Date.now(), cat, item, vendor, amount, note });
            persist();
            clearForm();
            renderAll();
        }
        function clearForm(){
            document.getElementById('expense-item').value='';
            document.getElementById('expense-vendor').value='';
            document.getElementById('expense-amount').value='';
            document.getElementById('expense-note').value='';
        }
        function setFilter(cat){ activeFilter = cat; renderAll(); }
        function renderChips(){
            const el = document.getElementById('chip-group');
            const cats = ["Todas", ...categories];
            el.innerHTML = cats.map(c=>`<button class="chip ${activeFilter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');
        }
        function groupByCategory(){
            const map = new Map();
            categories.forEach(c=>map.set(c, []));
            expenses.forEach(e=>{ if(map.has(e.cat)) map.get(e.cat).push(e); });
            return map;
        }
        function renderExpenses(){
            const cont = document.getElementById('categories-container');
            const groups = groupByCategory();
            const blocks = [];
            groups.forEach((items, cat)=>{
                const filtered = activeFilter==='Todas' ? items : (activeFilter===cat ? items : []);
                const total = filtered.reduce((s,i)=>s + (i.amount||0), 0);
                const rows = filtered.map(i=>`
                    <div class="expense-list">
                        <div>${i.item}${i.note?` — ${i.note}`:''}</div>
                        <div>${i.vendor||''}</div>
                        <div class="expense-amount">${formatBRL(i.amount||0)}</div>
                        <div class="expense-actions">
                            <button class="btn btn-secondary" onclick="editExpense(${i.id})">Editar</button>
                            <button class="btn btn-secondary" onclick="deleteExpense(${i.id})">Excluir</button>
                        </div>
                    </div>
                `).join('');
                if(activeFilter==='Todas' || activeFilter===cat){
                    blocks.push(`
                        <div class="category-group">
                            <div class="category-header"><span>${cat}</span><span class="category-total">${formatBRL(total)}</span></div>
                            ${rows || `<div class="expense-list"><div>Sem itens</div><div></div><div class="expense-amount">${formatBRL(0)}</div><div></div></div>`}
                        </div>
                    `);
                }
            });
            cont.innerHTML = blocks.join('');
        }
        function editExpense(id){
            const idx = expenses.findIndex(e=>e.id===id);
            if(idx<0) return;
            const e = expenses[idx];
            const novoItem = prompt('Item', e.item);
            if(novoItem===null) return;
            const novaCategoria = prompt('Categoria', e.cat);
            if(novaCategoria===null) return;
            const novoValorStr = prompt('Valor (R$)', String(e.amount));
            if(novoValorStr===null) return;
            const novoValor = parseFloat(novoValorStr);
            if(!categories.includes(novaCategoria)) { alert('Categoria inválida.'); return; }
            if(isNaN(novoValor)) { alert('Valor inválido.'); return; }
            e.item = novoItem.trim();
            e.cat = novaCategoria;
            e.amount = novoValor;
            persist();
            renderAll();
        }
        function deleteExpense(id){
            expenses = expenses.filter(e=>e.id!==id);
            persist();
            renderAll();
        }
        function sums(){
            const s = { agencia:0, despachante:0, tributos:0, porto:0, outros:0, total:0 };
            expenses.forEach(e=>{
                if(e.cat==='Agência Marítima') s.agencia += e.amount||0;
                else if(e.cat==='Despachante') s.despachante += e.amount||0;
                else if(e.cat==='Tributos') s.tributos += e.amount||0;
                else if(e.cat==='Porto') s.porto += e.amount||0;
                else s.outros += e.amount||0;
            });
            s.total = s.agencia + s.despachante + s.tributos + s.porto + s.outros;
            return s;
        }
        function renderSummary(){
            const s = sums();
            document.getElementById('sum-agencia').textContent = formatBRL(s.agencia);
            document.getElementById('sum-despachante').textContent = formatBRL(s.despachante);
            document.getElementById('sum-tributos').textContent = formatBRL(s.tributos);
            document.getElementById('sum-porto').textContent = formatBRL(s.porto);
            document.getElementById('sum-outros').textContent = formatBRL(s.outros);
            document.getElementById('sum-total').textContent = formatBRL(s.total);
        }
        function renderAll(){ renderExpenses(); renderSummary(); renderChips(); }
        function salvar(){ persist(); alert('Simulação salva.'); }
        function exportar(){
            const blob = new Blob([JSON.stringify(expenses,null,2)], {type:'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'despesas-importacao.json'; a.click();
            URL.revokeObjectURL(url);
        }
        function limpar(){ if(confirm('Nova simulação?')){ expenses = []; persist(); renderAll(); } }
        function duplicar(){ const key = 'import_cost_expenses_copy_'+Date.now(); localStorage.setItem(key, JSON.stringify(expenses)); alert('Simulação duplicada.'); }
        function finalizar(){ if(confirm('Finalizar importação?')){ alert('Importação finalizada.'); } }
        window.addEventListener('load', load);
    </script>
</body>
</html>
